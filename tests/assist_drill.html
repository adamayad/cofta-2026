<!doctype html><html lang="en"><head><meta charset="utf-8"><title>COFTA assist drill</title>
<link rel="stylesheet" href="../web/styles.css"><link rel="stylesheet" href="../web/themes.css">
<!--
  Assist drill.

  edit_event is a FULL REPLACE on the server, so the client has to send the
  assist it is currently showing on every edit — otherwise correcting a minute
  silently clears the assist beside it. That is the failure this drill exists
  to catch, and it is invisible from the UI.

  The role check is stubbed to "organiser" so the editor renders; edit_event
  is intercepted and captured rather than sent, so nothing reaches the live
  database. Everything else goes to the real server.

  Serve the repo root and open /tests/assist_drill.html; read
  globalThis.__assistSummary. Needs a connection and at least one goal on the
  live rehearsal data.
-->
<script>
localStorage.clear();
localStorage.setItem('cofta.session.v1', JSON.stringify({ access_token: 'drill', refresh_token: 'drill' }));

const sent = [];
// Edits are captured instead of sent, so the server never learns about them —
// but the app keeps polling the real snapshot every five seconds, and each
// poll overwrites the optimistic state with a copy that has no assist on it.
// The later assertions are about what survives a SECOND edit, so they need
// the first one to still be there when they run. The stub therefore plays the
// server's part: it remembers each edit and replays it into every snapshot
// that follows, which is exactly what a real edit_event would have caused.
const applied = new Map();
const realFetch = window.fetch.bind(window);
const ok = (body) => Promise.resolve(new Response(JSON.stringify(body),
  { status: 200, headers: { 'Content-Type': 'application/json' } }));
window.fetch = async (url, opts) => {
  const u = String(url);
  if (u.includes('/rpc/is_admin')) return ok(true);
  if (u.includes('/rpc/my_role'))  return ok('organiser');
  if (u.includes('/rpc/edit_event')) {          // captured, never sent
    let body; try { body = JSON.parse(opts.body); } catch { body = opts.body; }
    sent.push(body);
    if (body && body.p_event) applied.set(body.p_event, body);
    return ok(null);
  }
  const res = await realFetch(url, opts);
  if (!u.includes('/rpc/snapshot') || !applied.size) return res;
  const snap = await res.clone().json();
  for (const e of (snap?.events || [])) {
    const edit = applied.get(e.id);
    if (!edit) continue;
    e.p = edit.p_player;
    e.min = edit.p_minute;
    e.a = edit.p_assist;
  }
  return new Response(JSON.stringify(snap),
    { status: 200, headers: { 'Content-Type': 'application/json' } });
};

const results = [];
const check = (name, cond, detail) => results.push({ name, ok: !!cond, detail });
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const noTransition = () => { const s = document.createElement('style');
  s.textContent = '*,*::before,*::after{transition:none!important;animation:none!important}';
  document.head.appendChild(s); };

window.addEventListener('load', async () => {
  noTransition();
  await wait(3000);

  // Find a played match that has a goal on its report.
  //
  // The row list is re-queried by index every time rather than captured once:
  // going back to Fixtures re-renders the whole view, which detaches every
  // node held from before, so a cached list silently clicks nothing from the
  // second iteration on. This drill passed for weeks on that bug because the
  // first fixture happened to hold a goal; when the rehearsal data moved its
  // goals to later matches the loop "searched" twelve rows without opening
  // any of them.
  let goalEdit = null;
  const count = document.querySelectorAll('[data-match]').length;
  for (let i = 0; i < Math.min(count, 20); i++) {
    document.getElementById('nav-fixtures').click(); await wait(280);
    const row = document.querySelectorAll('[data-match]')[i];
    if (!row) continue;
    row.click(); await wait(420);
    const marks = [...document.querySelectorAll('.tl li .mk.goal')];
    if (marks.length) {
      goalEdit = marks[0].closest('li')?.querySelector('[data-edit]');
      if (goalEdit) break;
    }
  }
  check('found a goal to edit on the rehearsal data', !!goalEdit);

  if (goalEdit) {
    goalEdit.click(); await wait(350);
    const subs = [...document.querySelectorAll('.pksub')].map(s => s.textContent.trim());
    check('the goal editor labels both lists', subs.join('|') === 'Scored by|Assisted by', subs);

    const assistBtns = [...document.querySelectorAll('[data-edassist]')];
    check('an assist list is offered', assistBtns.length > 1, assistBtns.length);
    check('"No assist" is the first option',
      assistBtns[0]?.dataset.edassist === 'none' && /No assist/.test(assistBtns[0].textContent));

    const scorer = document.querySelector('[data-edpick].on:not([data-edpick="none"])');
    check('the scorer is excluded from their own assist list',
      !scorer || !assistBtns.some(b => b.dataset.edassist === scorer.dataset.edpick),
      scorer?.dataset.edpick);

    // choose an assist and save
    const pick = assistBtns.find(b => b.dataset.edassist !== 'none');
    const pickedId = pick.dataset.edassist;
    pick.click(); await wait(250);
    check('the chosen assist is marked selected',
      document.querySelector(`[data-edassist="${pickedId}"]`)?.classList.contains('on'));

    document.querySelector('[data-edsave]').click(); await wait(600);
    const payload = sent[sent.length - 1];
    check('edit_event carries the assist', payload && payload.p_assist === pickedId, payload);
    check('edit_event still carries player and minute',
      payload && 'p_player' in payload && /′$/.test(payload.p_minute || ''), payload);
    check('the report now shows the assist',
      !!document.querySelector('.asst'),
      document.querySelector('.asst')?.textContent.trim());

    // re-open and save again WITHOUT touching the assist: it must survive
    const again = document.querySelector('.tl li .mk.goal')?.closest('li')?.querySelector('[data-edit]');
    if (again) {
      again.click(); await wait(350);
      check('re-opening pre-selects the stored assist',
        document.querySelector(`[data-edassist="${pickedId}"]`)?.classList.contains('on'));
      document.querySelector('[data-edsave]').click(); await wait(600);
      const p2 = sent[sent.length - 1];
      check('a minute-only edit sends the assist back, not null',
        p2 && p2.p_assist === pickedId, p2);
    }

    // ── the one-tap path: "+ Assist" on the row, no Save ───────────────
    //
    // The whole risk here is the same full-replace trap the panel above
    // guards: a tap that sends only the assist would blank the scorer and the
    // minute, and NOTHING ON THE SCREEN WOULD SHOW IT. So the assertions are
    // about the payload, not about what the row looks like afterwards.
    const goalLi = document.querySelector('.tl li .mk.goal')?.closest('li');
    const assistBtn = goalLi?.querySelector('[data-assist]');
    check('a recorded goal offers an assist button on its own row', !!assistBtn,
      goalLi?.querySelector('.rowacts')?.textContent.replace(/\s+/g, ' ').trim());

    if (assistBtn) {
      assistBtn.click(); await wait(350);
      const panel = document.querySelector('.picker');
      check('it opens a picker and NOT the editor',
        !!panel && !document.querySelector('[data-edsave]'),
        panel?.querySelector('.pkhd span')?.textContent);
      check('the picker has no confirm button of any kind',
        !!panel && !panel.querySelector('[data-edsave],[data-assistsave]'));
      check('the header names the scorer it is asking about',
        /assisted/i.test(panel?.querySelector('.pkhd span')?.textContent || ''),
        panel?.querySelector('.pkhd span')?.textContent);

      const opts = [...document.querySelectorAll('[data-assistpick]')];
      const scorerId = sent[sent.length - 1]?.p_player;
      check('the scorer cannot assist their own goal',
        !opts.some(b => b.dataset.assistpick === scorerId), scorerId);

      const target = opts.find(b => b.dataset.assistpick !== 'none'
        && b.dataset.assistpick !== pickedId);
      if (target) {
        const newId = target.dataset.assistpick;
        const n = sent.length;
        target.click(); await wait(600);
        check('ONE TAP SENDS IT - no second confirming tap', sent.length === n + 1,
          { before: n, after: sent.length });
        const p3 = sent[sent.length - 1];
        check('the tap applied the assist chosen', p3 && p3.p_assist === newId, p3);
        check('AND SENT THE SCORER BACK - full replace, or it is wiped',
          p3 && p3.p_player === scorerId, p3);
        check('and the minute, still with its prime',
          p3 && /′$/.test(p3.p_minute || ''), p3?.p_minute);
        check('the picker closed itself', !document.querySelector('[data-assistpick]'));
        check('the row shows the new assist without a reload',
          /assist/i.test(document.querySelector('.tl li .asst')?.textContent || ''),
          document.querySelector('.tl li .asst')?.textContent.trim());
      } else {
        check('a second squad member was available to pick', false, opts.length);
      }
    }

    // ── Undo asks first, and says what it costs ────────────────────────
    //
    // confirm() is STUBBED TO REFUSE, so the drill can read the message
    // without ever voiding a goal on the live data. That also proves the
    // refusal path: saying no must send nothing.
    // RE-QUERY. `goalLi` was captured before the assist tap, and render()
    // has replaced the timeline since — a click on a detached node never
    // reaches the delegated handler, and the failure looks exactly like the
    // feature not working. This is the drill trap CLAUDE.md already names.
    const undoLi = document.querySelector('.tl li .mk.goal')?.closest('li');
    const undo = undoLi?.querySelector('[data-void]');
    check('the goal row still offers Undo', !!undo && document.contains(undo));
    if (undo) {
      const realConfirm = window.confirm;
      let asked = null;
      window.confirm = (msg) => { asked = msg; return false; };
      const n = sent.length;
      undo.click(); await wait(400);
      window.confirm = realConfirm;

      check('Undo asks before it does anything', typeof asked === 'string', asked);
      check('saying no sends NOTHING', sent.length === n, { before: n, after: sent.length });
      check('the goal is still on the report', !!document.querySelector('.tl li .mk.goal'));
      check('the warning names the score it would go back to',
        /score goes back to/i.test(asked || ''), asked);
      check('and is specific about the notification, either way',
        /already gone out|not been announced/i.test(asked || ''), asked);
      check('the row was not left in a half-undone state',
        !document.querySelector('.tl li.pending'));
    }
  }

  const summary = { total: results.length, failures: results.filter(r => !r.ok).length, results, sent };
  globalThis.__assistSummary = summary;
  const out = document.createElement('pre');
  out.id = 'assist-report';
  out.style.cssText = 'padding:12px;white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace';
  out.textContent = 'assist drill\n\n'
    + results.map(r => `${r.ok ? 'ok  ' : 'FAIL'}  ${r.name}`).join('\n')
    + `\n\n${summary.total - summary.failures}/${summary.total} passed`;
  document.body.appendChild(out);
});
</script></head>
<body data-theme="matchday">
<div class="app">
  <header class="hd"><button id="nav-admin" class="gear" data-view="admin" aria-label="Organiser"></button><h1 id="hd-title">COFTA 2026</h1><p class="meta"><span id="hd-when">12&ndash;13 September</span><span class="pip" id="pip"><i></i>Live</span></p></header>
  <nav class="nav">
    <button id="nav-fixtures" data-view="fixtures" class="on">Fixtures</button>
    <button id="nav-live" data-view="live">Live</button>
    <button id="nav-squads" data-view="squads">Squads</button>
    <button id="nav-tables" data-view="tables">Tables</button>
    <button id="nav-awards" data-view="awards">Stats</button>
    <button id="nav-history" data-view="history">History</button>
  </nav>
  <main class="scroll" id="body"><p class="empty">Loading&hellip;</p></main>
</div>
<script type="module" src="../web/app.js"></script>
</body></html>
