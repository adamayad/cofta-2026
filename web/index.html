<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COFTA 2026 — Live Scores</title>
<meta name="description" content="Live scores, fixtures and tables for the Coptic Orthodox Football Tournament Association 2026, 12–13 September.">
<!-- KEEP PLAYERS' NAMES OUT OF SEARCH ENGINES.
     The Squads tab and every match report name real people, alongside the
     church they play for and the venue and time they will be there. The
     tournament is 16+, so some players are 16 or 17 — children in UK
     safeguarding terms, whatever they can otherwise consent to. Nothing about
     a weekend tournament needs those names to be findable on Google, and the
     site is reached by QR code and a short URL, not by search.

     A robots.txt `Disallow` WOULD BE THE WRONG TOOL and would quietly do the
     opposite of what it looks like: it stops a crawler fetching the page, so
     the crawler never reads this tag, and a URL already known from a link can
     stay listed with no way to say "drop it". noindex requires the crawl to
     happen. Cloudflare's own robots.txt already blocks the AI training
     crawlers and allows search engines through — which is exactly what this
     needs, so we deliberately do NOT ship a robots.txt of our own.

     `web/_headers` does nothing on this project (proven twice), so an
     X-Robots-Tag header is not available and this tag is the mechanism.

     To make the site findable later, delete this line. -->
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#eef0f3">
<meta property="og:title" content="COFTA 2026 — Live Scores">
<meta property="og:description" content="Live scores, fixtures and tables. 12–13 September.">
<meta property="og:type" content="website">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="preload" href="./fonts/big-shoulders-display-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/saira-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./fonts.css?b=cofta-v98">
<link rel="stylesheet" href="./styles.css?b=cofta-v98">
<link rel="stylesheet" href="./themes.css?b=cofta-v98">
</head>
<body>
<div class="app">
  <header class="hd">
    <!-- A BELL, NOT A SHIELD. This button has always led to the same panel, but
         the shield spoke to the wrong person: it said "admin" or "security" to
         a spectator, who has no idea there is anything behind it for them.
         Notifications now live in that panel and are the ONLY reason most
         readers will ever open it, so the icon names the thing they want. It
         still carries data-view="admin" and organisers still find sign-in
         behind it — the label is now "Alerts and organiser" so a screen reader
         says both, and the dot still marks a signed-in session. -->
    <button id="nav-admin" class="gear" data-view="admin"
      aria-label="Alerts and organiser" title="Alerts and organiser">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"
        fill="none" stroke="currentColor" stroke-width="1.7"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8.4a6 6 0 1 0-12 0c0 5-2.1 6.4-2.1 6.4h16.2S18 13.4 18 8.4Z"/>
        <path d="M13.7 18.6a2 2 0 0 1-3.4 0"/>
      </svg><i class="gdot" aria-hidden="true"></i></button>
    <!-- Diocese and auspices follow the competition being viewed: CONAFA is
         played in the Midlands, not London. render() drives both. -->
    <p class="assoc"><img class="dio" id="hd-dio" src="./diocese.webp" alt="Coptic Orthodox Diocese of London" width="24" height="24">
      <span id="hd-assoc">Coptic Orthodox Football Tournament Association<i>Under the Auspices of HE Archbishop Angaelos</i></span></p>
    <h1 id="hd-title">COFTA 2026</h1>
    <!-- hd-when holds the dates on a live page and the way back to the live
         tournament on an archive one. The pip is a sibling and is never
         rebuilt, because render() writes its state before this runs. -->
    <p class="meta"><span id="hd-when">12&ndash;13 September</span><span class="pip" id="pip"><i></i>Live</span></p>
  </header>
  <nav class="nav">
    <button id="nav-fixtures" data-view="fixtures" class="on">Fixtures</button>
    <button id="nav-live"     data-view="live">Live</button>
    <button id="nav-squads"   data-view="squads">Squads</button>
    <button id="nav-tables"   data-view="tables">Tables</button>
    <button id="nav-awards"   data-view="awards">Stats</button>
    <button id="nav-history"  data-view="history">History</button>
  </nav>
  <main class="scroll" id="body"><p class="empty">Loading&hellip;</p></main>
</div>
<script type="module" src="./app.js?b=cofta-v98"></script>
</body>
</html>
